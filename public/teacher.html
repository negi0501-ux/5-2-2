<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실험 결과 공유하기 - 교사</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>👩‍🏫 교사 화면 · 7모둠 한눈에</h1><select id="grade"></select><select id="cls"></select></header>
<div class="grid" id="grid"></div>
<script src="common.js"></script>
<script>
fillRoomSelects();
let timer, groups = {};
function render() {
  grid.innerHTML = [1, 2, 3, 4, 5, 6, 7].map((i) => {
    const d = groups[i];
    return `<div class="card"><h2>${i}모둠 <small>${d ? esc(d.nickname) : ''}</small></h2>` +
      (d ? tableHtml(d) + legend(d) + `<div class="chart">${lineChart(d)}</div>` : '<div class="none">아직 입력 전</div>') + '</div>';
  }).join('');
}
function connect() {
  clearInterval(timer);
  localStorage.setItem('room', roomValue());
  const load = async () => {
    try {
      const r = await fetch('/api/data?room=' + roomValue(), { cache: 'no-store' });
      if (r.ok) { groups = await r.json(); render(); }
    } catch {}
  };
  load();
  timer = setInterval(load, 3000); // 3초마다 새로 불러오기
}
grade.onchange = cls.onchange = connect;
render(); connect();
</script></body></html>
